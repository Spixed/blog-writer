name: Electron packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要发布 Release 的 tag（如 v0.1.0）。留空则只上传 Artifacts，不发布 Release'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            electron_arch: x64
            target: win
          - os: macos-15-intel
            artifact: macos-x64
            electron_arch: x64
            target: mac
          - os: macos-15
            artifact: macos-arm64
            electron_arch: arm64
            target: mac
          - os: ubuntu-latest
            artifact: linux-x64
            electron_arch: x64
            target: linux
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            electron_arch: arm64
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: v1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install
      - run: bun run electron:dist --${{ matrix.target }} --${{ matrix.electron_arch }}
        env:
          BLOG_WRITER_TARGET_ARCH: ${{ matrix.electron_arch }}

      # 每个 target 单独一个 Artifact（不再全部混进同一个压缩包），
      # 并排除 win-unpacked/、*.blockmap、latest*.yml 等中间产物。
      # 其他平台匹配不到这些模式时静默跳过（if-no-files-found: ignore）。
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: blog-writer-${{ matrix.artifact }}-setup
          path: electron/release/*Setup-*.exe
          if-no-files-found: ignore

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: blog-writer-${{ matrix.artifact }}-portable
          path: electron/release/*Portable-*.exe
          if-no-files-found: ignore

      - name: Upload macOS dmg
        uses: actions/upload-artifact@v7
        with:
          name: blog-writer-${{ matrix.artifact }}-dmg
          path: electron/release/*.dmg
          if-no-files-found: ignore

      - name: Upload macOS zip
        uses: actions/upload-artifact@v7
        with:
          name: blog-writer-${{ matrix.artifact }}-maczip
          path: electron/release/*.zip
          if-no-files-found: ignore

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v7
        with:
          name: blog-writer-${{ matrix.artifact }}-appimage
          path: electron/release/*.AppImage
          if-no-files-found: ignore

      - name: Upload Linux deb
        uses: actions/upload-artifact@v7
        with:
          name: blog-writer-${{ matrix.artifact }}-deb
          path: electron/release/*.deb
          if-no-files-found: ignore

      # 推送 v* tag 自动发布；手动运行时在 release_tag 输入框填 tag 也可发布
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            electron/release/*Setup-*.exe
            electron/release/*Portable-*.exe
            electron/release/*.dmg
            electron/release/*.zip
            electron/release/*.AppImage
            electron/release/*.deb
