name: Electron packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            electron_arch: x64
            target: win
          - os: macos-15-intel
            artifact: macos-x64
            electron_arch: x64
            target: mac
          - os: macos-15
            artifact: macos-arm64
            electron_arch: arm64
            target: mac
          - os: ubuntu-latest
            artifact: linux-x64
            electron_arch: x64
            target: linux
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            electron_arch: arm64
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install
      - run: bun run electron:dist --${{ matrix.target }} --${{ matrix.electron_arch }}
        env:
          BLOG_WRITER_TARGET_ARCH: ${{ matrix.electron_arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: blog-writer-${{ matrix.artifact }}
          path: electron/release/*
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/release/*
